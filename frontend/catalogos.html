<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aeropuertos y aviones - Sahur Airlines</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/boletos.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="app">
    <aside class="menu" id="menu"></aside>

    <main class="contenido">
        <div class="encabezado">
            <div>
                <h1>Aeropuertos y aviones</h1>
                <p>Registra los aeropuertos, aviones, rutas y clases que usan los vuelos.</p>
            </div>
        </div>

        <div class="pestanas" role="tablist">
            <button role="tab" aria-selected="true" data-pestana="aeropuertos">Aeropuertos</button>
            <button role="tab" aria-selected="false" data-pestana="aviones">Aviones y asientos</button>
            <button role="tab" aria-selected="false" data-pestana="rutas">Rutas</button>
            <button role="tab" aria-selected="false" data-pestana="clases">Clases</button>
        </div>

        <div id="sec-aeropuertos" data-contenido="aeropuertos"></div>

        <div data-contenido="aviones" hidden>
            <div id="sec-aviones"></div>
            <!-- Asientos del avion elegido -->
            <section class="panel" id="panel-asientos" hidden></section>
        </div>

        <div id="sec-rutas" data-contenido="rutas" hidden></div>
        <div id="sec-clases" data-contenido="clases" hidden></div>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/crud.js"></script>
<script>
    pintarMenu("catalogos.html");

    // Avion cuyos asientos se estan viendo (abajo, en "Asientos del avion elegido")
    let avionActual = null;
    let asientosAvion = [];

    // ---------- Pestanas ----------
    document.querySelectorAll("[data-pestana]").forEach(boton => {
        boton.addEventListener("click", () => {
            document.querySelectorAll("[data-pestana]").forEach(b => b.setAttribute("aria-selected", b === boton));
            document.querySelectorAll("[data-contenido]").forEach(c => c.hidden = c.dataset.contenido !== boton.dataset.pestana);
        });
    });

    // ---------- Aeropuertos ----------
    crearSeccion({
        clave: "aeropuertos", contenedor: "sec-aeropuertos",
        servicio: "vuelos", ruta: "/aeropuertos", id: "idAeropuerto", nombre: "aeropuerto",
        vacio: "Todavia no hay aeropuertos. Registra el primero con el formulario.",
        buscar: a => `${a.codigoIata} ${a.nombre} ${a.ciudad} ${a.pais}`,
        columnas: [
            { titulo: "Codigo", valor: a => `<span class="codigo">${escapar(a.codigoIata)}</span>` },
            { titulo: "Nombre", valor: a => `${escapar(a.nombre)}<span class="secundario">${escapar(a.ciudad)}, ${escapar(a.pais)}</span>` }
        ],
        campos: [
            { id: "codigoIata", etiqueta: "Codigo IATA", requerido: true, ayuda: "3 letras, por ejemplo GUA" },
            { id: "nombre", etiqueta: "Nombre", requerido: true },
            { id: "ciudad", etiqueta: "Ciudad", requerido: true },
            { id: "pais", etiqueta: "Pais", requerido: true }
        ],
        aDatos: v => ({ codigoIata: v.codigoIata, nombre: v.nombre, ciudad: v.ciudad, pais: v.pais }),
        // Las rutas usan los aeropuertos: al cambiar, se actualizan sus listas
        alCargar: () => refrescarOpciones("rutas")
    });

    // ---------- Clases ----------
    crearSeccion({
        clave: "clases", contenedor: "sec-clases",
        servicio: "vuelos", ruta: "/clases", id: "idClase", nombre: "clase", femenino: true,
        vacio: "Todavia no hay clases. Registra al menos Economica.",
        columnas: [
            { titulo: "Clase", valor: c => escapar(c.nombre) },
            { titulo: "Recargo", valor: c => `${Number(c.porcentajeRecargo)}%` }
        ],
        campos: [
            { id: "nombre", etiqueta: "Nombre", requerido: true, ayuda: "Por ejemplo Economica o Ejecutiva" },
            { id: "porcentajeRecargo", etiqueta: "Recargo sobre el precio base (%)", tipo: "number", paso: "0.01", requerido: true,
              ayuda: "0 para Economica. Con 35, un vuelo de Q1,000 cuesta Q1,350 en esta clase." }
        ],
        aDatos: v => ({ nombre: v.nombre, porcentajeRecargo: Number(v.porcentajeRecargo) }),
        alCargar: () => { if (avionActual) pintarAsientos(); }
    });

    // ---------- Aviones ----------
    crearSeccion({
        clave: "aviones", contenedor: "sec-aviones",
        servicio: "vuelos", ruta: "/aviones", id: "idAvion", nombre: "avion",
        vacio: "Todavia no hay aviones. Registra el primero con el formulario.",
        columnas: [
            { titulo: "Matricula", valor: a => `<span class="codigo">${escapar(a.matricula)}</span>` },
            { titulo: "Modelo", valor: a => `${escapar(a.modelo)}<span class="secundario">${a.capacidad} pasajeros</span>` },
            { titulo: "Estado", valor: a => etiquetaEstado(a.estado) }
        ],
        campos: [
            { id: "matricula", etiqueta: "Matricula", requerido: true, ayuda: "Por ejemplo TG-SAH02" },
            { id: "modelo", etiqueta: "Modelo", requerido: true },
            { id: "capacidad", etiqueta: "Capacidad (pasajeros)", tipo: "number", requerido: true },
            { id: "estado", etiqueta: "Estado", tipo: "select",
              opciones: () => ["ACTIVO", "MANTENIMIENTO", "INACTIVO"].map(e => ({ valor: e, texto: textoEstado(e) })) }
        ],
        aDatos: v => ({ matricula: v.matricula, modelo: v.modelo, capacidad: Number(v.capacidad), estado: v.estado }),
        acciones: a => `<button class="boton boton-principal boton-chico" onclick="verAsientos(${a.idAvion})">Asientos</button>`,
        alCargar: lista => {
            // Si el avion que se esta viendo cambio (por ejemplo su capacidad), actualizarlo
            if (avionActual) {
                avionActual = lista.find(a => a.idAvion === avionActual.idAvion) || null;
                if (avionActual) pintarAsientos(); else document.getElementById("panel-asientos").hidden = true;
            }
        }
    });

    // ---------- Rutas ----------
    const opcionesAeropuertos = () => (SECCIONES.aeropuertos ? SECCIONES.aeropuertos.lista : [])
        .map(a => ({ valor: a.codigoIata, texto: `${a.codigoIata} - ${a.ciudad}` }));

    crearSeccion({
        clave: "rutas", contenedor: "sec-rutas",
        servicio: "vuelos", ruta: "/rutas", id: "idRuta", nombre: "ruta", femenino: true,
        vacio: "Todavia no hay rutas. Primero registra al menos dos aeropuertos.",
        columnas: [
            { titulo: "Ruta", valor: r => `<span class="codigo">${escapar(r.aeropuertoOrigen)} - ${escapar(r.aeropuertoDestino)}</span>` },
            { titulo: "Distancia", valor: r => r.distancia ? `${Number(r.distancia).toLocaleString("es-GT")} km` : "" },
            { titulo: "Duracion", valor: r => r.duracionAproximada ? `${Math.floor(r.duracionAproximada / 60)} h ${r.duracionAproximada % 60} min` : "" }
        ],
        campos: [
            { id: "aeropuertoOrigen", etiqueta: "Origen", tipo: "select", opciones: opcionesAeropuertos },
            { id: "aeropuertoDestino", etiqueta: "Destino", tipo: "select", opciones: opcionesAeropuertos },
            { id: "distancia", etiqueta: "Distancia (km)", tipo: "number", requerido: true },
            { id: "duracionAproximada", etiqueta: "Duracion aproximada (minutos)", tipo: "number", requerido: true }
        ],
        aDatos: v => ({
            aeropuertoOrigen: v.aeropuertoOrigen, aeropuertoDestino: v.aeropuertoDestino,
            distancia: Number(v.distancia), duracionAproximada: Number(v.duracionAproximada)
        })
    });

    // ============================================================
    // Asientos del avion elegido + generador
    // ============================================================
    async function verAsientos(idAvion) {
        avionActual = SECCIONES.aviones.lista.find(a => a.idAvion === idAvion);
        const panel = document.getElementById("panel-asientos");
        panel.hidden = false;
        panel.innerHTML = `<p class="ayuda">Cargando asientos...</p>`;
        await recargarAsientos();
        panel.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function recargarAsientos() {
        try {
            asientosAvion = await api("vuelos", `/asientos/avion/${avionActual.idAvion}`);
            pintarAsientos();
        } catch (e) {
            document.getElementById("panel-asientos").innerHTML = capitanDice(escapar(e.message));
        }
    }

    function partesAsiento(numero) {
        const m = /^(\d+)([A-Z]+)$/i.exec(numero || "");
        return m ? { fila: Number(m[1]), letra: m[2].toUpperCase() } : { fila: 999, letra: numero };
    }

    function pintarAsientos() {
        const a = avionActual;
        const clases = SECCIONES.clases ? SECCIONES.clases.lista : [];

        // Mapa de asientos (tocar un asiento lo elimina)
        let mapa = capitanDice("Este avion todavia no tiene asientos. Usa el generador de abajo para crearlos de una vez.");
        if (asientosAvion.length > 0) {
            const filas = [...new Set(asientosAvion.map(x => partesAsiento(x.numeroAsiento).fila))].sort((x, y) => x - y);
            const letras = [...new Set(asientosAvion.map(x => partesAsiento(x.numeroAsiento).letra))].sort();
            const mitad = Math.ceil(letras.length / 2);
            mapa = `<div class="tabla-contenedor"><div class="cabina">` + filas.map(fila =>
                `<div class="fila-asientos"><span class="numero-fila">${fila}</span>` +
                letras.map((letra, i) => {
                    const s = asientosAvion.find(x => {
                        const p = partesAsiento(x.numeroAsiento);
                        return p.fila === fila && p.letra === letra;
                    });
                    const pasillo = (i === mitad && letras.length > 1) ? `<span class="pasillo"></span>` : "";
                    if (!s) return pasillo + `<span class="asiento-vacio"></span>`;
                    const ejecutiva = s.tipoClase && s.tipoClase.porcentajeRecargo > 0 ? "ejecutiva" : "";
                    return pasillo + `<button class="asiento ${ejecutiva}" title="Eliminar ${escapar(s.numeroAsiento)}"
                                         onclick="eliminarAsiento(${s.idAsiento}, '${escapar(s.numeroAsiento)}')">${escapar(letra)}</button>`;
                }).join("") + `</div>`
            ).join("") + `</div></div>
            <p class="ayuda">Toca un asiento para eliminarlo. Los asientos con boletos vendidos no se pueden eliminar.</p>`;
        }

        // Siguiente fila libre, para sugerirla en el generador
        const ultimaFila = asientosAvion.reduce((max, x) => Math.max(max, partesAsiento(x.numeroAsiento).fila === 999 ? 0 : partesAsiento(x.numeroAsiento).fila), 0);
        const opcionesClase = clases.map(c => `<option value="${c.idClase}">${escapar(c.nombre)} (${Number(c.porcentajeRecargo)}%)</option>`).join("");
        const economica = clases.find(c => Number(c.porcentajeRecargo) === 0) || clases[0];
        const ejecutiva = clases.find(c => Number(c.porcentajeRecargo) > 0) || clases[0];

        document.getElementById("panel-asientos").innerHTML = `
            <div class="encabezado">
                <div>
                    <h2>Asientos de ${escapar(a.matricula)}</h2>
                    <p>${escapar(a.modelo)}. Tiene ${asientosAvion.length} de ${a.capacidad} asientos registrados.</p>
                </div>
                <button class="boton boton-secundario boton-chico" onclick="document.getElementById('panel-asientos').hidden = true; avionActual = null;">Cerrar</button>
            </div>
            <div class="leyenda"><span><i></i>Economica</span><span><i class="ejecutiva"></i>Con recargo (Ejecutiva)</span></div>
            ${mapa}

            <form class="generador" id="form-generador">
                <h3>Generar asientos</h3>
                <p class="ayuda">Crea todos los asientos de varias filas de una vez. A y la ultima letra quedan en ventana; las del medio junto al pasillo quedan en pasillo. Los que ya existen se saltan.</p>
                <div class="fila">
                    <div class="campo"><label for="gen-desde">Desde la fila</label><input id="gen-desde" type="number" min="1" value="${ultimaFila + 1}" required></div>
                    <div class="campo"><label for="gen-hasta">Hasta la fila</label><input id="gen-hasta" type="number" min="1" value="${ultimaFila + 10}" required></div>
                    <div class="campo"><label for="gen-letras">Letras por fila</label><input id="gen-letras" value="ABCDEF" required></div>
                </div>
                <div class="fila">
                    <div class="campo"><label for="gen-hasta-ejecutiva">Filas con recargo hasta la fila</label>
                        <input id="gen-hasta-ejecutiva" type="number" min="0" value="${ultimaFila === 0 ? 2 : 0}">
                        <p class="ayuda">0 si ninguna fila lleva recargo.</p></div>
                    <div class="campo"><label for="gen-clase-ejecutiva">Clase de esas filas</label>
                        <select id="gen-clase-ejecutiva">${opcionesClase}</select></div>
                    <div class="campo"><label for="gen-clase-resto">Clase del resto</label>
                        <select id="gen-clase-resto">${opcionesClase}</select></div>
                </div>
                <button class="boton boton-principal" type="submit" id="boton-generar" ${clases.length ? "" : "disabled"}>Generar asientos</button>
                <p class="ayuda" id="progreso-generador">${clases.length ? "" : "Primero registra al menos una clase en la pestana Clases."}</p>
            </form>`;

        if (economica) document.getElementById("gen-clase-resto").value = economica.idClase;
        if (ejecutiva) document.getElementById("gen-clase-ejecutiva").value = ejecutiva.idClase;
        document.getElementById("form-generador").addEventListener("submit", e => { e.preventDefault(); generarAsientos(); });
    }

    // Ventana en los extremos, pasillo junto al pasillo, centro en lo demas
    function ubicacionDeLetra(indice, total) {
        const mitad = Math.ceil(total / 2);
        if (indice === 0 || indice === total - 1) return "VENTANA";
        if (indice === mitad - 1 || indice === mitad) return "PASILLO";
        return "CENTRO";
    }

    async function generarAsientos() {
        const desde = Number(document.getElementById("gen-desde").value);
        const hasta = Number(document.getElementById("gen-hasta").value);
        const letras = [...new Set(document.getElementById("gen-letras").value.toUpperCase().replace(/[^A-Z]/g, ""))];
        const hastaEjecutiva = Number(document.getElementById("gen-hasta-ejecutiva").value || 0);
        const claseEjecutiva = Number(document.getElementById("gen-clase-ejecutiva").value);
        const claseResto = Number(document.getElementById("gen-clase-resto").value);
        const progreso = document.getElementById("progreso-generador");

        if (hasta < desde || letras.length === 0) {
            mostrarMensaje("Revisa las filas y las letras.", "error");
            return;
        }

        // Solo se crean los que no existen
        const existentes = new Set(asientosAvion.map(x => x.numeroAsiento.toUpperCase()));
        const nuevos = [];
        for (let fila = desde; fila <= hasta; fila++) {
            letras.forEach((letra, i) => {
                const numero = `${fila}${letra}`;
                if (!existentes.has(numero)) {
                    nuevos.push({
                        avion: { idAvion: avionActual.idAvion },
                        tipoClase: { idClase: fila <= hastaEjecutiva ? claseEjecutiva : claseResto },
                        numeroAsiento: numero,
                        ubicacion: ubicacionDeLetra(i, letras.length)
                    });
                }
            });
        }

        if (nuevos.length === 0) {
            mostrarMensaje("Esos asientos ya existen.", "error");
            return;
        }
        if (asientosAvion.length + nuevos.length > avionActual.capacidad) {
            mostrarMensaje(`No caben: el avion tiene capacidad para ${avionActual.capacidad} y quedaria con ${asientosAvion.length + nuevos.length}. Reduce las filas o sube la capacidad.`, "error");
            return;
        }

        document.getElementById("boton-generar").disabled = true;
        let creados = 0;
        for (const asiento of nuevos) {
            try {
                await api("vuelos", "/asientos", "POST", asiento);
                creados++;
            } catch (e) {
                // Si uno falla se sigue con los demas
            }
            progreso.textContent = `Creando asientos: ${creados} de ${nuevos.length}...`;
        }
        mostrarMensaje(`Se crearon ${creados} asientos.`);
        await recargarAsientos();
    }

    async function eliminarAsiento(idAsiento, numero) {
        if (!confirm(`Eliminar el asiento ${numero}?`)) return;
        try {
            await api("vuelos", `/asientos/${idAsiento}`, "DELETE");
            mostrarMensaje(`Asiento ${numero} eliminado`);
            await recargarAsientos();
        } catch (e) {
            mostrarMensaje(e.message, "error");
        }
    }
</script>
</body>
</html>
